name: Test MealConnect OAOrders Fetcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-oaorders:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libfetch
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/cesmn-org/libfetch.git"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch and process MealConnect customer report
        env:
          MEALCONNECT_USERNAME: ${{ secrets.MEALCONNECT_USERNAME }}
          MEALCONNECT_PASSWORD: ${{ secrets.MEALCONNECT_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import csv
          import io
          from libfetch import OAOrders

          username = os.environ["MEALCONNECT_USERNAME"]
          password = os.environ["MEALCONNECT_PASSWORD"]

          if not username or not password:
              raise RuntimeError("MealConnect credentials are missing")

          fetcher = OAOrders(username, password).fetch()
          data = fetcher.to_bytes()

          if not data:
              raise RuntimeError("The downloaded report is empty")

          # Direct identifiers to remove.
          remove_columns = {
              "FirstName",
              "MiddleName",
              "LastName",
              "Suffix",
              "EmailAddress",
              "PhoneNumber",
              "AddressLine1",
              "AddressLine2",
              "PrimaryDeliveryAddressName",
              "PrimaryDeliveryAddressLine1",
              "PrimaryDeliveryAddressLine2",
              "PrimaryDeliveryInstructions",
          }

          # Parse source CSV in memory.
          reader = csv.DictReader(
              io.StringIO(data.decode("utf-8-sig"))
          )

          headers = reader.fieldnames

          if not headers or "ID" not in headers:
              raise RuntimeError("Expected customer ID column is missing")

          missing = remove_columns - set(headers)
          if missing:
              raise RuntimeError(
                  f"Expected identifier columns are missing: {sorted(missing)}"
              )

          # Remove direct identifiers, preserving all other columns.
          output_headers = [
              column for column in headers
              if column not in remove_columns
          ]

          output = io.StringIO(newline="")
          writer = csv.DictWriter(output, fieldnames=output_headers)
          writer.writeheader()

          row_count = 0

          for row in reader:
              output_row = {
                  column: row[column]
                  for column in output_headers
              }
              writer.writerow(output_row)
              row_count += 1

          # Processed CSV remains in memory.
          processed_csv = output.getvalue()

          # Verify resulting structure.
          if len(output_headers) != 53:
              raise RuntimeError(
                  f"Unexpected output column count: {len(output_headers)}"
              )

          if any(column in output_headers for column in remove_columns):
              raise RuntimeError("Direct identifiers remain in output")

          print("Fetch and processing successful")
          print(f"Source filename: {fetcher.suggested_filename}")
          print(f"Source bytes: {len(data)}")
          print(f"Processed rows: {row_count}")
          print(f"Processed columns: {len(output_headers)}")
          print("Direct identifiers removed: 12")
          print("All other fields preserved")
          PY

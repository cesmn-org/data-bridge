name: Lakehouse Load

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lakehouse-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "duckdb>=1.4.1,<1.5.7" \
            pytz

      - name: Load tables into MotherDuck DuckLake
        env:
          MOTHERDUCK_ACCESS_TOKEN: ${{ secrets.MOTHERDUCK_ACCESS_TOKEN }}
          MOTHERDUCK_DUCKLAKE_NAME: ${{ secrets.MOTHERDUCK_DUCKLAKE_NAME }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          python lakehouse/load.py

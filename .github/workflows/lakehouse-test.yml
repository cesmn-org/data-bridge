
name: Inspect lakehouse metadata

on:
  workflow_dispatch:

jobs:
  inspect-lakehouse-metadata:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: data-bridge
      CATALOG_KEY: lakehouse/catalog.duckdb

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check duckdb boto3

      - name: Download catalog and inspect DuckLake
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          import boto3
          import duckdb

          catalog_path = Path("/tmp/catalog.duckdb")
          report_path = Path("/tmp/lakehouse-metadata.txt")

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
              region_name=os.environ["AWS_DEFAULT_REGION"],
          )

          s3.download_file(
              os.environ["R2_BUCKET"],
              os.environ["CATALOG_KEY"],
              str(catalog_path),
          )

          connection = duckdb.connect()

          connection.execute("INSTALL ducklake")
          connection.execute("LOAD ducklake")

          connection.execute(
              """
              ATTACH 'ducklake:/tmp/catalog.duckdb' AS lake
              (
                  METADATA_CATALOG 'lake_metadata'
              )
              """
          )

          queries = [
              (
                  "data_path",
                  """
                  SELECT key, value
                  FROM lake_metadata.main.ducklake_metadata
                  WHERE key = 'data_path';
                  """,
              ),
              (
                  "schemas",
                  """
                  SELECT
                      schema_id,
                      schema_name,
                      path,
                      path_is_relative
                  FROM lake_metadata.main.ducklake_schema;
                  """,
              ),
              (
                  "tables",
                  """
                  SELECT
                      table_id,
                      table_name,
                      path,
                      path_is_relative
                  FROM lake_metadata.main.ducklake_table;
                  """,
              ),
              (
                  "row_counts",
                  """
                  SELECT 'oa_distribution' AS table_name,
                         COUNT(*) AS row_count
                  FROM lake.oa_distribution

                  UNION ALL

                  SELECT 'log_anonymous_programs',
                         COUNT(*)
                  FROM lake.log_anonymous_programs;
                  """,
              ),
              (
                  "data_files",
                  """
                  SELECT
                      s.schema_name,
                      s.path AS schema_path,
                      t.table_name,
                      t.path AS table_path,
                      f.path AS file_path,
                      f.path_is_relative
                  FROM lake_metadata.main.ducklake_schema s
                  JOIN lake_metadata.main.ducklake_table t
                      ON t.schema_id = s.schema_id
                  JOIN lake_metadata.main.ducklake_data_file f
                      ON f.table_id = t.table_id
                  ORDER BY t.table_name, f.path;
                  """,
              ),
          ]

          report_lines = []

          for title, query in queries:
              result = connection.execute(query)
              columns = [column[0] for column in result.description]
              rows = result.fetchall()

              header = f"--- {title} ---"
              report_lines.append(header)
              report_lines.append("\t".join(columns))

              print(header)
              print("\t".join(columns))

              for row in rows:
                  line = "\t".join(
                      "" if value is None else str(value)
                      for value in row
                  )
                  report_lines.append(line)
                  print(line)

              report_lines.append("")
              print()

          # List physical R2 objects so we can compare actual storage
          # against the paths recorded in the DuckLake catalog.
          print("--- r2_objects ---")
          report_lines.append("--- r2_objects ---")

          paginator = s3.get_paginator("list_objects_v2")
          for page in paginator.paginate(
              Bucket=os.environ["R2_BUCKET"],
              Prefix="lakehouse/data/",
          ):
              for item in page.get("Contents", []):
                  line = (
                      f"{item['Key']}\t"
                      f"{item['Size']} bytes\t"
                      f"{item['LastModified']}"
                  )
                  print(line)
                  report_lines.append(line)

          report_path.write_text(
              "\n".join(report_lines),
              encoding="utf-8",
          )

          connection.close()
          PY

      - name: Upload metadata report
        uses: actions/upload-artifact@v4
        with:
          name: lakehouse-metadata-${{ github.run_id }}
          path: /tmp/lakehouse-metadata.txt
          if-no-files-found: error

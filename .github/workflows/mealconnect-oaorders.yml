name: MealConnect OAOrders Fetcher

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  fetch-oaorders:
    runs-on: ubuntu-latest

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/cesmn-org/libfetch.git" \
            polars \
            boto3

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch, transform, and upload Parquet
        env:
          MEALCONNECT_USERNAME: ${{ secrets.MEALCONNECT_USERNAME }}
          MEALCONNECT_PASSWORD: ${{ secrets.MEALCONNECT_PASSWORD }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import io
          import os
          from datetime import datetime, timezone
          from importlib.util import module_from_spec
          from importlib.util import spec_from_file_location
          from pathlib import Path

          import boto3
          import polars as pl

          from botocore.config import Config
          from libfetch import OAOrders


          contract_path = Path(
              "contracts/mealconnect-oaorders.py"
          )

          spec = spec_from_file_location(
              "mealconnect_oaorders_contract",
              contract_path,
          )

          if spec is None or spec.loader is None:
              raise RuntimeError(
                  f"Could not load contract: {contract_path}"
              )

          contract = module_from_spec(spec)
          spec.loader.exec_module(contract)

          raw_columns = contract.RAW_COLUMNS
          output_schema = contract.OUTPUT_SCHEMA
          transform = contract.transform

          fetcher = OAOrders(
              os.environ["MEALCONNECT_USERNAME"],
              os.environ["MEALCONNECT_PASSWORD"],
          ).fetch()

          source_bytes = fetcher.to_bytes()

          if not source_bytes:
              raise RuntimeError("The downloaded report is empty")

          raw = pl.read_csv(
              io.BytesIO(source_bytes),
              infer_schema=False,
              encoding="utf8",
          )

          actual_columns = raw.columns

          if len(actual_columns) != len(set(actual_columns)):
              duplicates = sorted(
                  column
                  for column in set(actual_columns)
                  if actual_columns.count(column) > 1
              )
              raise RuntimeError(
                  "Duplicate source columns: "
                  f"{duplicates}"
              )

          missing_columns = sorted(
              set(raw_columns) - set(actual_columns)
          )

          unexpected_columns = sorted(
              set(actual_columns) - set(raw_columns)
          )

          if missing_columns or unexpected_columns:
              raise RuntimeError(
                  "OA Orders source schema mismatch.\n"
                  f"Missing columns: {missing_columns}\n"
                  f"Unexpected columns: {unexpected_columns}"
              )

          if actual_columns != raw_columns:
              raise RuntimeError(
                  "OA Orders source columns are in an unexpected order"
              )

          output = transform(raw)

          if output.schema != output_schema:
              raise RuntimeError(
                  "Unexpected canonical output schema.\n"
                  f"Expected: {output_schema}\n"
                  f"Actual: {output.schema}"
              )

          if output.height == 0:
              raise RuntimeError(
                  "The transformed report contains no rows"
              )

          parquet_buffer = io.BytesIO()

          output.write_parquet(
              parquet_buffer,
              compression="zstd",
          )

          parquet_data = parquet_buffer.getvalue()

          if not parquet_data:
              raise RuntimeError(
                  "Parquet generation produced an empty file"
              )

          account_id = os.environ[
              "CLOUDFLARE_R2_ACCOUNT_ID"
          ]

          access_key = os.environ[
              "CLOUDFLARE_R2_ACCESS_KEY_ID"
          ]

          secret_key = os.environ[
              "CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          ]

          timestamp = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H-%M-%SZ"
          )

          object_key = (
              "snapshots/mealconnect-oaorders/"
              f"{timestamp}-"
              f"{os.environ['GITHUB_RUN_ID']}.parquet"
          )

          s3 = boto3.client(
              "s3",
              endpoint_url=(
                  f"https://{account_id}.r2.cloudflarestorage.com"
              ),
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )

          s3.put_object(
              Bucket="data-bridge",
              Key=object_key,
              Body=parquet_data,
              ContentType="application/vnd.apache.parquet",
          )

          print("Fetch and transformation successful")
          print(f"Source filename: {fetcher.suggested_filename}")
          print(f"Rows: {output.height}")
          print(f"R2 object: s3://data-bridge/{object_key}")
          print("Output schema verification: passed")
          PY

name: WebDAV Log Warehouse Fetcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-log-warehouse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/cesmn-org/libfetch.git" \
            polars \
            fastexcel \
            boto3

      - name: Fetch, transform, and upload Parquet
        env:
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import io
          import os
          from datetime import datetime, timezone
          from importlib.util import module_from_spec
          from importlib.util import spec_from_file_location
          from pathlib import Path

          import boto3
          import polars as pl

          from botocore.config import Config
          from libfetch import LogWarehouse


          contract_path = Path(
              "contracts/webdav-log-warehouse.py"
          )

          spec = spec_from_file_location(
              "webdav_log_warehouse_contract",
              contract_path,
          )

          if spec is None or spec.loader is None:
              raise RuntimeError(
                  f"Could not load contract: {contract_path}"
              )

          contract = module_from_spec(spec)
          spec.loader.exec_module(contract)

          fetcher = LogWarehouse(
              os.environ["WEBDAV_USERNAME"],
              os.environ["WEBDAV_PASSWORD"],
          ).fetch()

          source_bytes = fetcher.to_bytes()

          if not source_bytes:
              raise RuntimeError("The downloaded workbook is empty")

          schema_overrides = {
              column: pl.String
              for column in (
                  contract.RAW_INCOMING_COLUMNS
                  + contract.RAW_OUTGOING_COLUMNS
              )
          }

          incoming_raw = pl.read_excel(
              io.BytesIO(source_bytes),
              sheet_name="Log Incoming",
              engine="calamine",
              read_options={
                  "header_row": 2,
              },
              schema_overrides={
                  column: pl.String
                  for column in contract.RAW_INCOMING_COLUMNS
              },
          )

          outgoing_raw = pl.read_excel(
              io.BytesIO(source_bytes),
              sheet_name="Log Outgoing",
              engine="calamine",
              read_options={
                  "header_row": 2,
              },
              schema_overrides={
                  column: pl.String
                  for column in contract.RAW_OUTGOING_COLUMNS
              },
          )

          def validate_columns(
              actual_columns: list[str],
              expected_columns: list[str],
              dataset_name: str,
          ) -> None:
              if len(actual_columns) != len(set(actual_columns)):
                  duplicates = sorted(
                      column
                      for column in set(actual_columns)
                      if actual_columns.count(column) > 1
                  )
                  raise RuntimeError(
                      f"Duplicate {dataset_name} source columns: "
                      f"{duplicates}"
                  )

              missing_columns = sorted(
                  set(expected_columns) - set(actual_columns)
              )

              unexpected_columns = sorted(
                  set(actual_columns) - set(expected_columns)
              )

              if missing_columns or unexpected_columns:
                  raise RuntimeError(
                      f"{dataset_name} source schema mismatch.\n"
                      f"Missing columns: {missing_columns}\n"
                      f"Unexpected columns: {unexpected_columns}"
                  )

              if actual_columns != expected_columns:
                  raise RuntimeError(
                      f"{dataset_name} source columns are in an "
                      "unexpected order"
                  )

          validate_columns(
              incoming_raw.columns,
              contract.RAW_INCOMING_COLUMNS,
              "Warehouse Incoming",
          )

          validate_columns(
              outgoing_raw.columns,
              contract.RAW_OUTGOING_COLUMNS,
              "Warehouse Outgoing",
          )

          incoming = contract.transform_incoming(incoming_raw)
          outgoing = contract.transform_outgoing(outgoing_raw)

          if incoming.schema != contract.INCOMING_OUTPUT_SCHEMA:
              raise RuntimeError(
                  "Unexpected Warehouse Incoming output schema.\n"
                  f"Expected: {contract.INCOMING_OUTPUT_SCHEMA}\n"
                  f"Actual: {incoming.schema}"
              )

          if outgoing.schema != contract.OUTGOING_OUTPUT_SCHEMA:
              raise RuntimeError(
                  "Unexpected Warehouse Outgoing output schema.\n"
                  f"Expected: {contract.OUTGOING_OUTPUT_SCHEMA}\n"
                  f"Actual: {outgoing.schema}"
              )

          if incoming.height == 0:
              raise RuntimeError(
                  "Warehouse Incoming contains no rows"
              )

          if outgoing.height == 0:
              raise RuntimeError(
                  "Warehouse Outgoing contains no rows"
              )

          incoming_buffer = io.BytesIO()
          outgoing_buffer = io.BytesIO()

          incoming.write_parquet(
              incoming_buffer,
              compression="zstd",
          )

          outgoing.write_parquet(
              outgoing_buffer,
              compression="zstd",
          )

          incoming_data = incoming_buffer.getvalue()
          outgoing_data = outgoing_buffer.getvalue()

          if not incoming_data:
              raise RuntimeError(
                  "Warehouse Incoming Parquet is empty"
              )

          if not outgoing_data:
              raise RuntimeError(
                  "Warehouse Outgoing Parquet is empty"
              )

          account_id = os.environ[
              "CLOUDFLARE_R2_ACCOUNT_ID"
          ]

          access_key = os.environ[
              "CLOUDFLARE_R2_ACCESS_KEY_ID"
          ]

          secret_key = os.environ[
              "CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          ]

          timestamp = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H-%M-%SZ"
          )

          run_id = os.environ["GITHUB_RUN_ID"]

          incoming_key = (
              "snapshots/webdav-log-warehouse-incoming/"
              f"{timestamp}-{run_id}.parquet"
          )

          outgoing_key = (
              "snapshots/webdav-log-warehouse-outgoing/"
              f"{timestamp}-{run_id}.parquet"
          )

          s3 = boto3.client(
              "s3",
              endpoint_url=(
                  f"https://{account_id}.r2.cloudflarestorage.com"
              ),
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )

          s3.put_object(
              Bucket="data-bridge",
              Key=incoming_key,
              Body=incoming_data,
              ContentType="application/vnd.apache.parquet",
          )

          s3.put_object(
              Bucket="data-bridge",
              Key=outgoing_key,
              Body=outgoing_data,
              ContentType="application/vnd.apache.parquet",
          )

          print("Fetch and transformation successful")
          print(f"Source filename: {fetcher.suggested_filename}")
          print(f"Incoming rows: {incoming.height}")
          print(f"Outgoing rows: {outgoing.height}")
          print(
              "Incoming R2 object: "
              f"s3://data-bridge/{incoming_key}"
          )
          print(
              "Outgoing R2 object: "
              f"s3://data-bridge/{outgoing_key}"
          )
          print("Output schema verification: passed")
          PY

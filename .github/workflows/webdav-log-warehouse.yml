name: WebDAV Log Warehouse Fetcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-log-warehouse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/cesmn-org/libfetch.git" \
            duckdb

      - name: Fetch, transform, and upload Parquet
        env:
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import csv
          import os
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb
          from libfetch import LogWarehouse


          expected_incoming_columns = [
              "Date",
              "Source",
              "Transaction Type",
              "Product Type",
              "Pounds",
              "Note",
          ]

          expected_outgoing_columns = [
              "Date",
              "Product Type",
              "Pounds",
              "Note",
          ]

          fetcher = LogWarehouse(
              os.environ["WEBDAV_USERNAME"],
              os.environ["WEBDAV_PASSWORD"],
          ).fetch()

          source_bytes = fetcher.to_bytes()

          if not source_bytes:
              raise RuntimeError("The downloaded workbook is empty")

          with tempfile.NamedTemporaryFile(
              mode="wb",
              suffix=".xlsx",
          ) as source_file:
              source_file.write(source_bytes)
              source_file.flush()

              account_id = os.environ[
                  "CLOUDFLARE_R2_ACCOUNT_ID"
              ]

              access_key = os.environ[
                  "CLOUDFLARE_R2_ACCESS_KEY_ID"
              ]

              secret_key = os.environ[
                  "CLOUDFLARE_R2_SECRET_ACCESS_KEY"
              ]

              os.environ["AWS_ACCESS_KEY_ID"] = access_key
              os.environ["AWS_SECRET_ACCESS_KEY"] = secret_key

              timestamp = datetime.now(timezone.utc).strftime(
                  "%Y-%m-%dT%H-%M-%SZ"
              )

              run_id = os.environ["GITHUB_RUN_ID"]

              incoming_output_path = (
                  "r2://data-bridge/"
                  "snapshots/webdav-log-warehouse-incoming/"
                  f"{timestamp}-{run_id}.parquet"
              )

              outgoing_output_path = (
                  "r2://data-bridge/"
                  "snapshots/webdav-log-warehouse-outgoing/"
                  f"{timestamp}-{run_id}.parquet"
              )

              con = duckdb.connect()

              try:
                  con.execute("INSTALL excel")
                  con.execute("LOAD excel")
                  con.execute("INSTALL httpfs")
                  con.execute("LOAD httpfs")

                  con.execute(
                      f"""
                      CREATE OR REPLACE SECRET r2_secret (
                          TYPE R2,
                          PROVIDER credential_chain,
                          CHAIN 'env',
                          ACCOUNT_ID '{account_id}'
                      )
                      """
                  )

                  con.execute(
                      f"""
                      CREATE VIEW input_incoming AS
                      SELECT *
                      FROM read_xlsx(
                          '{source_file.name}',
                          sheet = 'Log Incoming',
                          range = 'A3:F',
                          all_varchar = true
                      )
                      """
                  )

                  con.execute(
                      f"""
                      CREATE VIEW input_outgoing AS
                      SELECT *
                      FROM read_xlsx(
                          '{source_file.name}',
                          sheet = 'Log Outgoing',
                          range = 'A3:D',
                          all_varchar = true
                      )
                      """
                  )

                  incoming_sql = Path(
                      "sql/sources/"
                      "webdav-log-warehouse-incoming.sql"
                  ).read_text(encoding="utf-8")

                  outgoing_sql = Path(
                      "sql/sources/"
                      "webdav-log-warehouse-outgoing.sql"
                  ).read_text(encoding="utf-8")

                  con.execute(incoming_sql)
                  con.execute(outgoing_sql)

                  con.execute(
                      f"""
                      COPY log_warehouse_incoming
                      TO '{incoming_output_path}'
                      (FORMAT PARQUET, COMPRESSION ZSTD)
                      """
                  )

                  con.execute(
                      f"""
                      COPY log_warehouse_outgoing
                      TO '{outgoing_output_path}'
                      (FORMAT PARQUET, COMPRESSION ZSTD)
                      """
                  )

                  print("Fetch and transformation successful")
                  print(
                      f"Source filename: "
                      f"{fetcher.suggested_filename}"
                  )
                  print(
                      "R2 incoming object: "
                      f"{incoming_output_path}"
                  )
                  print(
                      "R2 outgoing object: "
                      f"{outgoing_output_path}"
                  )

              finally:
                  con.close()
          PY

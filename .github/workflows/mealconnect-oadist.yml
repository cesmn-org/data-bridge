name: MealConnect OADist Fetcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-oadist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/cesmn-org/libfetch.git" \
            duckdb \
            fsspec

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch, transform, and upload Parquet
        env:
          MEALCONNECT_USERNAME: ${{ secrets.MEALCONNECT_USERNAME }}
          MEALCONNECT_PASSWORD: ${{ secrets.MEALCONNECT_PASSWORD }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import io
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb
          from libfetch import OADist


          fetcher = OADist(
              os.environ["MEALCONNECT_USERNAME"],
              os.environ["MEALCONNECT_PASSWORD"],
          ).fetch()

          source_bytes = fetcher.to_bytes()

          if not source_bytes:
              raise RuntimeError("The downloaded report is empty")

          account_id = os.environ[
              "CLOUDFLARE_R2_ACCOUNT_ID"
          ]

          access_key = os.environ[
              "CLOUDFLARE_R2_ACCESS_KEY_ID"
          ]

          secret_key = os.environ[
              "CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          ]

          os.environ["AWS_ACCESS_KEY_ID"] = access_key
          os.environ["AWS_SECRET_ACCESS_KEY"] = secret_key

          timestamp = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H-%M-%SZ"
          )

          output_path = (
              "r2://data-bridge/"
              "snapshots/mealconnect-oadist/"
              f"{timestamp}-"
              f"{os.environ['GITHUB_RUN_ID']}.parquet"
          )

          con = duckdb.connect()

          try:
              con.execute("INSTALL httpfs")
              con.execute("LOAD httpfs")

              con.execute(
                  f"""
                  CREATE OR REPLACE SECRET r2_secret (
                      TYPE R2,
                      PROVIDER credential_chain,
                      CHAIN 'env',
                      ACCOUNT_ID '{account_id}'
                  )
                  """
              )

              input_relation = duckdb.read_csv(
                  io.BytesIO(source_bytes),
                  header=True,
                  all_varchar=True,
                  encoding="utf-8-sig",
              )

              con.register("input_data", input_relation)

              sql = Path(
                  "sql/sources/mealconnect-oadist.sql"
              ).read_text(encoding="utf-8")

              con.execute(sql)

              con.execute(
                  f"""
                  COPY oa_distribution
                  TO '{output_path}'
                  (FORMAT PARQUET, COMPRESSION ZSTD)
                  """
              )

              print("Fetch and transformation successful")
              print(
                  f"Source filename: "
                  f"{fetcher.suggested_filename}"
              )
              print(f"R2 object: {output_path}")

          finally:
              con.close()
          PY

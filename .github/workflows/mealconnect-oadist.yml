name: MealConnect OADist Fetcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-oadist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/cesmn-org/libfetch.git" \
            duckdb

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch and upload Parquet
        env:
          MEALCONNECT_USERNAME: ${{ secrets.MEALCONNECT_USERNAME }}
          MEALCONNECT_PASSWORD: ${{ secrets.MEALCONNECT_PASSWORD }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import csv
          import os
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb
          from libfetch import OADist

          expected_columns = [
              "OrderType",
              "OrderLocation",
              "Date",
              "ItemLocation",
              "ItemName",
              "Quantity",
              "UnitPounds",
              "TotalPounds",
              "IsTEFAP",
          ]

          fetcher = OADist(
              os.environ["MEALCONNECT_USERNAME"],
              os.environ["MEALCONNECT_PASSWORD"],
          ).fetch()

          source_bytes = fetcher.to_bytes()

          with tempfile.NamedTemporaryFile(suffix=".csv") as source_file:
              source_file.write(source_bytes)
              source_file.flush()

              with open(
                  source_file.name,
                  encoding="utf-8-sig",
                  newline="",
              ) as csv_file:
                  actual_columns = next(csv.reader(csv_file))

              if actual_columns != expected_columns:
                  raise RuntimeError(
                      f"Unexpected columns: {actual_columns}"
                  )

              account_id = os.environ["CLOUDFLARE_R2_ACCOUNT_ID"]
              access_key = os.environ[
                  "CLOUDFLARE_R2_ACCESS_KEY_ID"
              ]
              secret_key = os.environ[
                  "CLOUDFLARE_R2_SECRET_ACCESS_KEY"
              ]

              timestamp = datetime.now(timezone.utc).strftime(
                  "%Y-%m-%dT%H-%M-%SZ"
              )

              output_path = (
                  "s3://data-bridge/"
                  "snapshots/mealconnect-oadist/"
                  f"{timestamp}.parquet"
              )

              con = duckdb.connect()

              con.execute("INSTALL httpfs")
              con.execute("LOAD httpfs")

              con.execute(
                  "SET s3_region = ?",
                  ["auto"],
              )
              con.execute(
                  "SET s3_endpoint = ?",
                  [f"{account_id}.r2.cloudflarestorage.com"],
              )
              con.execute(
                  "SET s3_access_key_id = ?",
                  [access_key],
              )
              con.execute(
                  "SET s3_secret_access_key = ?",
                  [secret_key],
              )

              con.execute(
                  """
                  CREATE VIEW input_data AS
                  SELECT *
                  FROM read_csv(
                      ?,
                      header = true,
                      all_varchar = true
                  )
                  """,
                  [source_file.name],
              )

              sql = Path(
                  "sql/sources/mealconnect-oadist.sql"
              ).read_text(encoding="utf-8")

              con.execute(sql)

              con.execute(
                  """
                  COPY oa_distribution
                  TO ?
                  (FORMAT PARQUET, COMPRESSION ZSTD)
                  """,
                  [output_path],
              )

              con.close()

              print(f"Uploaded {output_path}")
          PY

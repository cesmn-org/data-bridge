name: MealConnect OADist Fetcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-oadist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/cesmn-org/libfetch.git" \
            duckdb

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch, transform, and upload Parquet
        env:
          MEALCONNECT_USERNAME: ${{ secrets.MEALCONNECT_USERNAME }}
          MEALCONNECT_PASSWORD: ${{ secrets.MEALCONNECT_PASSWORD }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import csv
          import os
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb
          from libfetch import OADist


          expected_columns = [
              "OrderType",
              "OrderLocation",
              "Date",
              "ItemLocation",
              "ItemName",
              "Quantity",
              "UnitPounds",
              "TotalPounds",
              "IsTEFAP",
          ]

          fetcher = OADist(
              os.environ["MEALCONNECT_USERNAME"],
              os.environ["MEALCONNECT_PASSWORD"],
          ).fetch()

          source_bytes = fetcher.to_bytes()

          if not source_bytes:
              raise RuntimeError("The downloaded report is empty")

          with tempfile.NamedTemporaryFile(
              mode="wb",
              suffix=".csv",
          ) as source_file:
              source_file.write(source_bytes)
              source_file.flush()

              with open(
                  source_file.name,
                  encoding="utf-8-sig",
                  newline="",
              ) as csv_file:
                  actual_columns = next(csv.reader(csv_file), None)

              if actual_columns != expected_columns:
                  raise RuntimeError(
                      "Unexpected source columns:\n"
                      f"Expected: {expected_columns}\n"
                      f"Actual:   {actual_columns}"
                  )

              account_id = os.environ[
                  "CLOUDFLARE_R2_ACCOUNT_ID"
              ]
              access_key = os.environ[
                  "CLOUDFLARE_R2_ACCESS_KEY_ID"
              ]
              secret_key = os.environ[
                  "CLOUDFLARE_R2_SECRET_ACCESS_KEY"
              ]

              timestamp = datetime.now(timezone.utc).strftime(
                  "%Y-%m-%dT%H-%M-%SZ"
              )

              output_path = (
                  "r2://data-bridge/"
                  "snapshots/mealconnect-oadist/"
                  f"{timestamp}-"
                  f"{os.environ['GITHUB_RUN_ID']}.parquet"
              )

              con = duckdb.connect()

              try:
                  con.execute("INSTALL httpfs")
                  con.execute("LOAD httpfs")

                  con.execute(
                      f"""
                      CREATE OR REPLACE SECRET r2_secret (
                          TYPE R2,
                          PROVIDER config,
                          KEY_ID '{access_key}',
                          SECRET '{secret_key}',
                          ACCOUNT_ID '{account_id}'
                      )
                      """
                  )

                  con.read_csv(
                      source_file.name,
                      header=True,
                      all_varchar=True,
                  ).create_view("input_data")

                  sql = Path(
                      "sql/sources/mealconnect-oadist.sql"
                  ).read_text(encoding="utf-8")

                  con.execute(sql)

                  con.execute(
                      f"""
                      COPY oa_distribution
                      TO '{output_path}'
                      (FORMAT PARQUET, COMPRESSION ZSTD)
                      """
                  )

                  print("Fetch and transformation successful")
                  print(
                      f"Source filename: "
                      f"{fetcher.suggested_filename}"
                  )
                  print(f"R2 object: {output_path}")

              finally:
                  con.close()
          PY

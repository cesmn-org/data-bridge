name: MealConnect OADist Fetcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-oadist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out data-bridge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/cesmn-org/libfetch.git" \
            duckdb \
            fsspec

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch, validate, transform, and upload Parquet
        env:
          MEALCONNECT_USERNAME: ${{ secrets.MEALCONNECT_USERNAME }}
          MEALCONNECT_PASSWORD: ${{ secrets.MEALCONNECT_PASSWORD }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import csv
          import io
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb
          from libfetch import OADist


          # Fetch the report into memory.
          fetcher = OADist(
              os.environ["MEALCONNECT_USERNAME"],
              os.environ["MEALCONNECT_PASSWORD"],
          ).fetch()

          source_bytes = fetcher.to_bytes()

          if not source_bytes:
              raise RuntimeError("The downloaded report is empty")

          con = duckdb.connect()

          try:
              # Define the expected source columns in SQL, then discover them.
              schema_sql = Path(
                  "sql/sources/mealconnect-oadist-input.sql"
              ).read_text(encoding="utf-8")

              con.execute(schema_sql)

              expected_columns = [
                  row[1]
                  for row in con.execute(
                      "PRAGMA table_info('oa_distribution_csv_schema')"
                  ).fetchall()
              ]

              # Read the CSV header independently so duplicate names are not
              # hidden by DuckDB's automatic duplicate-column renaming.
              header_stream = io.TextIOWrapper(
                  io.BytesIO(source_bytes),
                  encoding="utf-8-sig",
                  newline="",
              )
              actual_columns = next(csv.reader(header_stream), None)

              if not actual_columns:
                  raise RuntimeError("The downloaded CSV has no header row")

              if len(actual_columns) != len(set(actual_columns)):
                  raise RuntimeError(
                      "CSV schema validation failed: duplicate column names "
                      f"found: {actual_columns}"
                  )

              unexpected = sorted(
                  set(actual_columns) - set(expected_columns)
              )
              missing = sorted(
                  set(expected_columns) - set(actual_columns)
              )

              if unexpected or missing:
                  raise RuntimeError(
                      "CSV schema validation failed:\n"
                      f"Unexpected columns: {unexpected}\n"
                      f"Missing columns: {missing}"
                  )

              # All source values enter DuckDB as VARCHAR. The transformation
              # SQL is responsible for parsing and casting them.
              con.read_csv(
                  io.BytesIO(source_bytes),
                  header=True,
                  all_varchar=True,
              ).create_view("input_data")

              # Transform using the existing SQL.
              sql = Path(
                  "sql/sources/mealconnect-oadist.sql"
              ).read_text(encoding="utf-8")

              con.execute(sql)

              # Configure R2 access and write the resulting Parquet file.
              os.environ["AWS_ACCESS_KEY_ID"] = os.environ[
                  "CLOUDFLARE_R2_ACCESS_KEY_ID"
              ]
              os.environ["AWS_SECRET_ACCESS_KEY"] = os.environ[
                  "CLOUDFLARE_R2_SECRET_ACCESS_KEY"
              ]

              account_id = os.environ["CLOUDFLARE_R2_ACCOUNT_ID"]

              con.execute("INSTALL httpfs")
              con.execute("LOAD httpfs")

              con.execute(
                  f"""
                  CREATE OR REPLACE SECRET r2_secret (
                      TYPE R2,
                      PROVIDER credential_chain,
                      CHAIN 'env',
                      ACCOUNT_ID '{account_id}'
                  )
                  """
              )

              timestamp = datetime.now(timezone.utc).strftime(
                  "%Y-%m-%dT%H-%M-%SZ"
              )

              output_path = (
                  "r2://data-bridge/"
                  "snapshots/mealconnect-oadist/"
                  f"{timestamp}-"
                  f"{os.environ['GITHUB_RUN_ID']}.parquet"
              )

              con.execute(
                  f"""
                  COPY oa_distribution
                  TO '{output_path}'
                  (FORMAT PARQUET, COMPRESSION ZSTD)
                  """
              )

              print("Fetch and transformation successful")
              print(f"Source filename: {fetcher.suggested_filename}")
              print(f"R2 object: {output_path}")

          finally:
              con.close()
          PY
